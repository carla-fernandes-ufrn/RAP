name: Django CI

on:
  push:
    branches:
      - Teste
  pull_request:
    branches:
      - Teste

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      DJANGO_SETTINGS_MODULE: rap.settings_test
      DJANGO_SECRET_KEY: ci-only-not-production-000000000000000000000000000000
      DEBUG: "False"
      DATABASE_URL: "sqlite:///:memory:"
      DATABASE_SSL_REQUIRE: "False"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_HOST: smtp.invalid
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      DEFAULT_FROM_EMAIL: "Projeto RAP CI <ci@rap.invalid>"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run Django system check
        run: python manage.py check --settings=rap.settings_test

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=rap.settings_test

      - name: Run complete test suite
        run: python manage.py test --settings=rap.settings_test --noinput
